[project]
name = "score-from-audio"
version = "1.0.0"
description = "Model export for the score-from-audio Android app: Transkun and bd1 to ONNX"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "thenewgoat" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "onnx>=1.15", "onnxruntime>=1.17", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
transkun = ["transkun==2.0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["export*", "notation*"]

[tool.pytest.ini_options]
testpaths = ["export/tests"]
