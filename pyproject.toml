[project]
name = "score-from-audio"
version = "1.0.0"
description = "The score-from-audio Android app's model export, and ytpipe: YouTube piano videos to aligned score/performance pairs"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "thenewgoat" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "onnx>=1.15", "onnxruntime>=1.17", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
transkun = ["transkun==2.0.1"]
# ytpipe also needs ffmpeg on PATH, Audiveris for `omr` and MuseScore for `edit`/`export`. Its `align` stage
# transcribes with the older basic-pitch detector (vendored ONNX in transcribe/models) and Beat This! beats.
ytpipe = ["yt-dlp", "opencv-python-headless", "music21>=9,<11", "scipy>=1.10", "librosa>=0.10", "soundfile>=0.12",
          "mido>=1.3", "verovio>=4", "torch>=2.0", "einops", "soxr", "rotary-embedding-torch", "beat-this"]

[project.scripts]
ytpipe = "ytpipe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["export*", "notation*", "ytpipe*", "transcribe*", "evaluation*"]

[tool.setuptools.package-data]
ytpipe = ["editor.html"]
transcribe = ["models/*"]

[tool.pytest.ini_options]
testpaths = ["export/tests", "tests"]
