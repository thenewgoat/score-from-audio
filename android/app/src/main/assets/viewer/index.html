<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; background: #fff; -webkit-tap-highlight-color: transparent; }
    #score { position: relative; color: #1D1C1A; padding-bottom: 40vh; }
    .page svg { width: 100%; height: auto; display: block; }
    .playing, .playing * { fill: #2A5D8F !important; stroke: #2A5D8F !important; }
    #cursor { position: absolute; width: 3px; border-radius: 1.5px; background: #2A5D8F; opacity: 0.85;
              pointer-events: none; display: none; }
    .looped { position: absolute; background: rgba(42, 93, 143, 0.10); border-top: 2px solid rgba(42, 93, 143, 0.45);
              pointer-events: none; }
  </style>
</head>
<body>
  <div id="score"></div>
  <script src="timemap.js"></script>
  <script src="verovio-toolkit-wasm.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
